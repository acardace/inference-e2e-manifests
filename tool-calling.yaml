---
# LLMInferenceService for tool-calling conformance
# Model: Qwen/Qwen3-4B-Instruct-2507 (agentic/tool-calling tuned, fits 16GB T4 GPUs)
# Parser: hermes (Qwen3 tool-call format)
# Requires: 1x GPU (16GB VRAM, e.g. NVIDIA T4)
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: tool-calling
spec:
  model:
    uri: "hf://Qwen/Qwen3-4B-Instruct-2507"
    name: Qwen/Qwen3-4B-Instruct-2507
  replicas: 1
  router:
    route: {}
    scheduler:
      template:
        imagePullSecrets:
        - name: rhai-pull-secret
        containers:
        - name: main
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    containers:
      - name: main
        env:
          # Qwen3-4B-Instruct-2507 has a 262144-token native context; vLLM
          # requires KV space for one full max-length sequence (~36 GiB),
          # which a 16GB T4 cannot provide (~5 GiB free after weights).
          # 8192 is ~6x the conformance prompts and fits with margin.
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --enable-auto-tool-choice
              --tool-call-parser=hermes
              --enable-log-requests
              --enable-log-outputs
              --max-model-len 8192
        resources:
          limits:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: '2'
            memory: 16Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
